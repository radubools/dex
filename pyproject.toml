[project]
name = "dex"
version = "0.1.0"
description = "Async task server that drives the Claude Agent SDK to generate algorithm study material"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
    "pydantic>=2.9",
    # Every queue, store and event read goes through it. It was missing here
    # while being imported by `dex.db`, so it only ever worked in a venv that
    # had picked it up some other way: a clean `uv sync` produced a server that
    # died on its first import. The Docker build is what surfaced that.
    "asyncpg>=0.30",
    # The Google token exchange. Declared rather than leaned on: it was only
    # ever a dev dependency (fastapi's TestClient), so a --no-dev install would
    # have had the login path import something that is not there -- exactly the
    # asyncpg mistake again.
    "httpx>=0.27",
    # Reading a PDF's bookmark tree and its per-page text, for the survey that
    # plans work out of an uploaded document. Pure Python, so it adds no build
    # step and no binary to the image.
    "pypdf>=5.0",
    # Heading trees out of uploaded and fetched HTML. Already present as a
    # transitive dependency; declared because `dex.sources` imports it
    # directly, which is the asyncpg mistake recorded above.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Animation rendering. Heavy (cairo/pango/ffmpeg); the server runs without it
# and reports manim as unavailable rather than failing tasks at random.
manim = ["manim>=0.18"]
# Narration for the animations. Local and offline: the alternative was a system
# voice, which reads technical prose like a station announcement.
voice = ["piper-tts>=1.7"]
# What a *project's* code imports, rather than dex's. These were in the venv
# and declared nowhere — `uv sync` would have pruned them, and every yoga task
# would then have failed on `import utils.rig`. A skill records what it needs
# in its own `skill.json`, but nothing reconciles that with the environment, so
# the list is kept here by hand and the audit is one line:
#
#   every name in `skills/*/*/skill.json` `requires` resolves in the venv
#
# pandas is here because it was asked for, not because a skill imports one yet.
tasks = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    # Spreadsheets pandas cannot open on its own: openpyxl for `.xlsx`, xlrd
    # for the pre-2007 `.xls` that neither the browser preview nor SheetJS
    # reads either — see design/13.
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # The fast reader pandas uses via `engine="calamine"`, and the only one
    # here that reads legacy `.xls` and `.xlsb` as well as `.xlsx`.
    "python-calamine>=0.2",
    # `music-packages` writes MIDI.
    "pretty_midi>=0.2.10",
]
# Typed decisions from a local model, for the `laya-decisions` skill. An extra
# for the same reason manim is: it pulls mlx, which ships arm64 macOS wheels
# and nothing else. Installed on this machine it answers in one forward pass;
# on a box without Apple silicon `laya-mlx` still installs and then cannot
# import `mlx`, so it has no business in the base dependency list that every
# deployment resolves.
laya = ["laya-mlx>=0.2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
dex = "dex.__main__:main"
dex-cli = "dex.cli:main"
dex-warm = "dex.tools.warm_animations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
