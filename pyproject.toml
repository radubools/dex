[project]
name = "dex"
version = "0.1.0"
description = "Async task server that drives the Claude Agent SDK to generate algorithm study material"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
    "pydantic>=2.9",
    # Every queue, store and event read goes through it. It was missing here
    # while being imported by `dex.db`, so it only ever worked in a venv that
    # had picked it up some other way: a clean `uv sync` produced a server that
    # died on its first import. The Docker build is what surfaced that.
    "asyncpg>=0.30",
    # The Google token exchange. Declared rather than leaned on: it was only
    # ever a dev dependency (fastapi's TestClient), so a --no-dev install would
    # have had the login path import something that is not there -- exactly the
    # asyncpg mistake again.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Animation rendering. Heavy (cairo/pango/ffmpeg); the server runs without it
# and reports manim as unavailable rather than failing tasks at random.
manim = ["manim>=0.18"]
# Narration for the animations. Local and offline: the alternative was a system
# voice, which reads technical prose like a station announcement.
voice = ["piper-tts>=1.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
dex = "dex.__main__:main"
dex-cli = "dex.cli:main"
dex-warm = "dex.tools.warm_animations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
