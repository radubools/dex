# Power the dex VM off once it has been idle for half an hour.
#
#   install -o root -g root -m 0600 dex-idle-stop.conf /etc/monit/conf.d/
#
# Monit refuses to start if any control file is group- or world-readable, so
# the 0600 is load-bearing, not tidiness.
#
# `check system` may appear ONCE in the whole configuration. Ubuntu's stock
# /etc/monit/monitrc ships one commented out; if you uncomment it, move the
# `if memory usage` line into that block instead of installing this file, or
# monit dies at startup with a syntax error.
#
# The cycle length comes from `set daemon` in /etc/monit/monitrc, NOT from
# here. 30 cycles is thirty minutes only while that is 60. Change one and the
# window moves silently, so change both:
#
#   set daemon 60 with start delay 900
#
# The start delay matters more than it looks. After you power the VM back on
# it is, by definition, idle -- nothing is queued yet because you have not
# queued it. Without the delay monit begins counting toward a shutdown the
# moment it boots. 900s of delay plus 30 cycles means the earliest a fresh
# boot can power itself off is 45 minutes, which is the grace period for
# actually starting work.

check system $HOST

    # Measured 2026-09-16 on dex (Ubuntu 26.04, 7422 MB total): a fully idle
    # box -- pm2, the dex API, Postgres 18 and tailscaled all up, load 0.00 --
    # sits at 705 MB used. 800 MB is that floor plus ~95 MB of headroom.
    #
    # `memory usage` excludes buffers and page cache, so this does not drift
    # upward just because something read a large file. It is resident memory
    # that processes actually hold.
    #
    # The margin is thin by design and it errs in the safe direction: a stray
    # process nudging past 800 MB resets the counter and the box stays up. The
    # failure mode is a VM that does not power off, never one that powers off
    # mid-task.
    if memory usage < 800 MB
        for 30 cycles
        then exec "/usr/local/sbin/dex-idle-stop"

    # Memory is a proxy for "nobody is using this", and a coarse one. The
    # script it calls re-checks what idle actually means -- no live task in the
    # queue, no operator logged in, no recent events -- and refuses if any of
    # those disagree. Treat the test above as the cheap trigger and the script
    # as the decision.

    # Observation only. Neither of these stops anything; they exist so that
    # `monit status` and the alert mail say something useful about a box that
    # turned out to be busier than expected.
    if loadavg (5min) > 6 for 3 cycles then alert
    if memory usage > 90% for 5 cycles then alert
    if swap usage > 25% for 5 cycles then alert
